# Tailwind 的包族（@tailwindcss/node、@tailwindcss/oxide …）在 Windows 默认的
# isolated 链接布局下出现过「只链了一半」的问题（顶层只有空壳目录、传递依赖缺失），
# 改用扁平 node_modules 布局规避；Linux/CI 下同样适用，行为一致。
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  # @nuxt/content 的构建期数据库（SQLite）需要编译原生绑定
  better-sqlite3: true
  # @nuxt/ui 的传递依赖（vue-demi）需要 postinstall 写 Vue 版本适配入口
  vue-demi: true
  # wrangler 的运行时（workerd）需要下载对应平台的二进制
  workerd: true

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.45'
  - '@vue/compiler-dom@3.5.45'
  - '@vue/compiler-sfc@3.5.45'
  - '@vue/compiler-ssr@3.5.45'
  - '@vue/reactivity@3.5.45'
  - '@vue/runtime-core@3.5.45'
  - '@vue/runtime-dom@3.5.45'
  - '@vue/server-renderer@3.5.45'
  - '@vue/shared@3.5.45'
  - vue@3.5.45
