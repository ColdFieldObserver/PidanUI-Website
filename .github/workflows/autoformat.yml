name: Auto Format (Prettier)

# 用途：在非 main 分支上，如果 Prettier 检查出格式问题，就自动格式化并 push 回该分支
#
# 触发：只监听 push（PR 由 lint.yml 负责守门，这里不做格式化，避免往 fork 的 PR 分支乱写）
# 排除：main 分支不执行（main 的格式问题应通过 PR 修正，不允许机器人直接改 main）
on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  # 需要写权限才能把格式化结果 push 回分支
  contents: write

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Prettier auto-fix
    runs-on: ubuntu-latest
    # 防循环：机器人自己提交的 commit 不再触发本工作流
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 用 GITHUB_TOKEN 拉取并推送；如需触发下游 workflow，可换成 PAT
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先检查，有问题才进入格式化，避免无谓改动
      - name: Check formatting
        id: check
        continue-on-error: true
        run: pnpm run format:check

      # 有格式问题时执行修正
      - name: Run Prettier write
        if: steps.check.outcome == 'failure'
        run: pnpm exec prettier --write .

      # 若产生改动则提交并 push 回当前分支
      - name: Commit and push changes
        if: steps.check.outcome == 'failure'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Prettier check failed but no file changes were produced; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          # [skip format] 用于阻止机器人提交再次触发本工作流，避免死循环
          git commit -m "chore: auto-format with Prettier [skip format]"
          git push