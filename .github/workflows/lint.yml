name: Lint & Format

# 代码风格守门：ESLint（可能出错的地方）+ Prettier（排版）+ 构建校验
#
# 三个触发来源：
#   pull_request      —— 所有 PR（含 fork 发起的）都跑一次
#   push              —— 所有分支推送（含 main）都跑，部署前先过这一关
#   workflow_dispatch —— 需要手动重跑时
#
# 部署已改为 Cloudflare Workers（维护者本地执行 `pnpm deploy`），仓库里不再有
# GitHub Pages 部署流水线；构建校验因此挂在这里，保证「检查不过就不该发版」。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先查排版：报错信息是「哪个文件没按 Prettier 排」，比 lint 报错更好定位
      - name: Prettier (format:check)
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      # 构建同时验证预渲染：failOnError 下任何缺页都会让这一步失败
      - name: Build
        run: pnpm run build
